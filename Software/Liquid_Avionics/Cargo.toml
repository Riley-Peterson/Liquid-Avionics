[package]
name = "Liquid_Avionics"
version = "0.1.0"
edition = "2024"
default-run = "flight"

[lib]
name = "liquid_avionics"

# Flight software. diag and pt_can are picked up from src/bin/ automatically.
[[bin]]
name = "flight"
path = "src/main.rs"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "exti", "memory-x", "stm32f446re", "time-driver-any", "unstable-pac"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
